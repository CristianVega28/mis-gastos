# Producción en el VPS: web (nginx con la app de Expo).
# La API vive en su propio proyecto (mis-gastos-api); aquí solo se indica dónde está.
# Copia .env.example a .env y completa los valores antes de levantar.
services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      # nginx reenvía /api a esta URL (sin barra final)
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8080}:80"
